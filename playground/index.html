<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Theme preview playground</title>
    <style>
      :root {
        --background: oklch(0.985 0 0);
        --foreground: oklch(0.21 0 0);
        --card: oklch(1 0 0);
        --card-foreground: oklch(0.21 0 0);
        --primary: oklch(0.21 0 0);
        --primary-foreground: oklch(0.985 0 0);
        --secondary: oklch(0.96 0 0);
        --secondary-foreground: oklch(0.25 0 0);
        --muted: oklch(0.96 0 0);
        --muted-foreground: oklch(0.5 0 0);
        --accent: oklch(0.96 0 0);
        --accent-foreground: oklch(0.21 0 0);
        --border: oklch(0.9 0 0);
        --input: oklch(0.9 0 0);
        --ring: oklch(0.21 0 0);
        --sidebar: oklch(0.97 0 0);
        --sidebar-foreground: oklch(0.21 0 0);
        --radius: 0.5rem;
      }
      .dark {
        --background: oklch(0.14 0 0);
        --foreground: oklch(0.98 0 0);
        --card: oklch(0.18 0 0);
        --card-foreground: oklch(0.98 0 0);
        --primary: oklch(0.98 0 0);
        --primary-foreground: oklch(0.14 0 0);
        --secondary: oklch(0.24 0 0);
        --secondary-foreground: oklch(0.98 0 0);
        --muted: oklch(0.24 0 0);
        --muted-foreground: oklch(0.7 0 0);
        --accent: oklch(0.24 0 0);
        --accent-foreground: oklch(0.98 0 0);
        --border: oklch(0.28 0 0);
        --input: oklch(0.28 0 0);
        --ring: oklch(0.98 0 0);
        --sidebar: oklch(0.16 0 0);
        --sidebar-foreground: oklch(0.98 0 0);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        grid-template-columns: 220px 1fr;
        background: var(--background);
        color: var(--foreground);
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      aside {
        background: var(--sidebar);
        color: var(--sidebar-foreground);
        border-right: 1px solid var(--border);
        padding: 20px 16px;
      }
      main { padding: 32px 28px 120px; }
      h1 { font-size: 1.5rem; letter-spacing: -0.03em; margin: 0 0 8px; }
      p { color: var(--muted-foreground); max-width: 52ch; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 24px 0; }
      .card {
        background: var(--card);
        color: var(--card-foreground);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px;
      }
      .stat { font-size: 1.4rem; font-weight: 600; margin: 6px 0 0; }
      button.primary {
        border: 0;
        border-radius: var(--radius);
        background: var(--primary);
        color: var(--primary-foreground);
        padding: 8px 14px;
        cursor: pointer;
      }
      input {
        height: 36px;
        border: 1px solid var(--input);
        border-radius: var(--radius);
        background: var(--background);
        color: var(--foreground);
        padding: 0 10px;
      }
      nav button {
        display: block;
        width: 100%;
        text-align: left;
        border: 0;
        background: var(--accent);
        color: var(--accent-foreground);
        border-radius: 8px;
        padding: 8px 10px;
        margin-top: 8px;
      }
      @media (max-width: 720px) {
        body { grid-template-columns: 1fr; }
        aside { border-right: 0; border-bottom: 1px solid var(--border); }
      }
    </style>
  </head>
  <body>
    <aside>
      <strong>Acme</strong>
      <nav>
        <button type="button">Overview</button>
        <button type="button">Customers</button>
      </nav>
    </aside>
    <main>
      <h1>Product dashboard</h1>
      <p>Open the swatch in the corner, then pick a theme. This page uses shadcn CSS variables so the preview is real.</p>
      <div class="row">
        <section class="card">
          <div>Revenue</div>
          <p class="stat">$24,500</p>
        </section>
        <section class="card">
          <div>Active users</div>
          <p class="stat">1,284</p>
        </section>
      </div>
      <p><input placeholder="Search customers" /> <button class="primary" type="button">New invoice</button></p>
    </main>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
